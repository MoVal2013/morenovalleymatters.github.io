<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 MVM SpookyMap</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff7ee;
    color: #23170f;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 14px 36px;
  }

  .back {
    display: inline-block;
    margin: 10px 0 8px;
    color: #2d211b;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }

  .back:hover {
    text-decoration: underline;
  }

  .panel {
    position: relative;
    width: 100%;
  }

  .hero {
    display: block;
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(56,31,20,.18);
  }

  .hub {
    display: block;
    width: 100%;
    margin-top: 16px;
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(56,31,20,.14);
  }

  .hotspot {
    position: absolute;
    display: block;
    z-index: 3;
    border-radius: 10px;
  }

  .hotspot:hover {
    outline: 3px solid rgba(255,122,10,.7);
    background: rgba(255,122,10,.06);
  }

  /*
    HERO SUBMIT BUTTON
    Adjust these percentages only if the hero image is replaced.
  */
  .hero-submit {
    left: 29%;
    top: 59%;
    width: 42%;
    height: 11%;
  }

  /*
    HUB MAP HOTSPOTS
    These are ready for URLs as each map goes live.
  */
  .all-events {
    left: 9%;
    top: 22%;
    width: 46%;
    height: 14%;
  }

  .by-type {
    left: 48%;
    top: 34%;
    width: 44%;
    height: 14%;
  }

  .by-date {
    left: 10%;
    top: 48%;
    width: 47%;
    height: 14%;
  }

  .by-area {
    left: 48%;
    top: 61%;
    width: 44%;
    height: 14%;
  }


  /* Event List link — separate from the existing map-image hotspots. */
  .event-list-link {
    display: block;
    margin: 18px auto 0;
    padding: 18px 16px;
    border: 3px solid #51216b;
    border-radius: 14px;
    background: #f58220;
    color: #231327;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(56,31,20,.16);
  }
  .event-list-link strong {
    display: block;
    font-size: clamp(18px, 3.4vw, 27px);
    line-height: 1.3;
  }
  .event-list-link span {
    display: block;
    margin-top: 6px;
    font-size: clamp(13px, 2.4vw, 17px);
    line-height: 1.5;
  }
  .event-list-link:hover, .event-list-link:focus-visible {
    background: #ff9b42;
    outline: 3px solid #51216b;
    outline-offset: 2px;
  }

  .coming {
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .wrap {
      padding-left: 8px;
      padding-right: 8px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to Home</a>

  <div class="panel">
    <img
      class="hero"
      src="spookymap-2026-hero.png"
      alt="MVM SpookyMap 2026">

    <a
      class="hotspot hero-submit"
      href="https://docs.google.com/forms/d/e/1FAIpQLSftMHHAvFEkbcIgneKyEfZzSxEfoRDigTOlhb-FJlRS4QkfVA/viewform?usp=header"
      target="_blank"
      rel="noopener"
      aria-label="Submit your event to the 2026 MVM SpookyMap">
    </a>
  </div>

  <div class="panel">
    <img
      class="hub"
      src="spookymap-2026-hub-final.png"
      alt="MVM SpookyMap Hub with map options">

    <!--
      MAP LINKS:
      When each map is ready, replace the <span> with an <a href="...">,
      keeping the same class name.

      Example:
      <a class="hotspot all-events"
         href="PASTE_MAP_URL_HERE"
         target="_blank"
         rel="noopener"
         aria-label="View all 2026 SpookyMap events"></a>
    -->

    <a class="hotspot all-events"
       href="https://www.google.com/maps/d/viewer?mid=1uvHIHldayYJglQEI6BZ10yCzAwK6nrU"
       target="_blank"
       rel="noopener"
       aria-label="View all 2026 SpookyMap events"></a>

    <a class="hotspot by-type"
       href="https://www.google.com/maps/d/viewer?mid=1FDbNTmO9HYH0olXejManflkI8qgQhxw"
       target="_blank"
       rel="noopener"
       aria-label="Browse 2026 SpookyMap events by Event Type"></a>

    <a class="hotspot by-date"
       href="https://www.google.com/maps/d/viewer?mid=12-8LqwfzcKingUv0gECfWbXscYJ8X18"
       target="_blank"
       rel="noopener"
       aria-label="Browse 2026 SpookyMap events by Date"></a>

    <a class="hotspot by-area"
       href="https://www.google.com/maps/d/viewer?mid=19rRDvuaiWgC50nSeuTbprYEsKjgiYeE"
       target="_blank"
       rel="noopener"
       aria-label="Browse 2026 SpookyMap events by ZIP or Area"></a>
  </div>

  <a class="event-list-link"
     href="https://script.google.com/macros/s/AKfycbwQqwCcmcm9MBUo_jz0eR1d2SXcToakzj4kLOSdS-T-JlLsZztRzhAznZwr9MJxicU/exec"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Browse the searchable SpookyMap 2026 Event List">
    <strong>📋 BROWSE THE SPOOKYMAP EVENT LIST</strong>
    <span>Prefer a list instead of a map? Search by street, ZIP code, or event type. See what's happening today!</span>
  </a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 MVM SpookyMap</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff7ee;
    color: #23170f;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 14px 34px;
  }
  .back {
    display: inline-block;
    margin: 10px 0 8px;
    color: #2d211b;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .back:hover { text-decoration: underline; }

  .hero {
    display: block;
    width: 100%;
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(56,31,20,.18);
  }

  .hub-wrap {
    position: relative;
    margin-top: 16px;
    width: 100%;
  }
  .hub-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
    box-shadow: 0 10px 26px rgba(56,31,20,.14);
  }

  /* Clickable overlays. Coordinates are percentages of the hub image. */
  .hotspot {
    position: absolute;
    display: block;
    z-index: 2;
    border-radius: 8px;
  }
  .hotspot.live:hover {
    outline: 3px solid rgba(255,122,10,.65);
    background: rgba(255,122,10,.06);
  }

  /* Sign positions */
  .all-events { left: 10%; top: 21%; width: 45%; height: 14%; }
  .by-type    { left: 48%; top: 31%; width: 44%; height: 14%; }
  .by-date    { left: 11%; top: 45%; width: 47%; height: 14%; }
  .by-area    { left: 48%; top: 56%; width: 44%; height: 14%; }
  .submit     { left: 25%; top: 78%; width: 52%; height: 12%; }

  /* Not live yet */
  .disabled {
    cursor: default;
  }

  @media (max-width: 700px) {
    .wrap { padding-left: 8px; padding-right: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to Home</a>

  <img class="hero" src="spookymap-2026-hero.png" alt="MVM SpookyMap 2026">

  <div class="hub-wrap">
    <img class="hub-img" src="spookymap-2026-hub.png" alt="MVM SpookyMap Hub">

    <span class="hotspot all-events disabled" aria-label="View All Events — coming soon"></span>
    <span class="hotspot by-type disabled" aria-label="Browse by Event Type — coming soon"></span>
    <span class="hotspot by-date disabled" aria-label="Browse by Date — coming soon"></span>
    <span class="hotspot by-area disabled" aria-label="Browse by ZIP or Area — coming soon"></span>

    <a class="hotspot submit live"
       href="https://docs.google.com/forms/d/e/1FAIpQLSftMHHAvFEkbcIgneKyEfZzSxEfoRDigTOlhb-FJlRS4QkfVA/viewform?usp=header"
       target="_blank"
       rel="noopener"
       aria-label="Submit Your Event"></a>
  </div>
</div>
</body>
</html>
